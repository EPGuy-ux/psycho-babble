<title>Number Steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column (max 880px) under a plain header with text tabs. Every view opens with a title and one line saying what to do here. The three phases are told apart only by a muted tint on the step number. */
:root{
  --bg:#F6F4F0; --surface:#FFFFFF; --surface-2:#FAF8F5; --ink:#2B2F38; --muted:#5F6672; --line:#E6E2DC; --line-strong:#CDC7BE;
  --accent:#2F7D73; --accent-ink:#FFFFFF; --accent-soft:#E2EEEB; --accent-deep:#235F57;
  --a:#B4654E; --a-soft:#F4E7E2;
  --b:#9C782C; --b-soft:#F3ECDB;
  --c:#55688E; --c-soft:#E6EAF2;
  --ok:#3E7D5A; --ok-soft:#E1EFE7; --mid:#B0701F; --mid-soft:#F7EBD6; --no:#6B7280; --no-soft:#ECEDF0;
  --on-status:#FFFFFF;
  --say:#EDF2F6; --say-ink:#2E4557;
  --shadow:0 1px 2px rgba(43,47,56,.05), 0 6px 16px -10px rgba(43,47,56,.18);
  --r:6px; --r-lg:8px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1D22; --surface:#24272E; --surface-2:#2A2D35; --ink:#E9E7E2; --muted:#A3A7AF; --line:#373B44; --line-strong:#4A4F5A;
  --accent:#6DB3A7; --accent-ink:#141A19; --accent-soft:#253A37; --accent-deep:#8CC8BE;
  --a:#D4917C; --a-soft:#3A2B26;
  --b:#CBA55A; --b-soft:#37301F;
  --c:#8FA2CC; --c-soft:#272C3A;
  --ok:#7CBF98; --ok-soft:#21342A; --mid:#D9A454; --mid-soft:#3A2F1B; --no:#A0A6B1; --no-soft:#30343C;
  --on-status:#141A19;
  --say:#2A3741; --say-ink:#C9DCE8;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B1D22; --surface:#24272E; --surface-2:#2A2D35; --ink:#E9E7E2; --muted:#A3A7AF; --line:#373B44; --line-strong:#4A4F5A;
  --accent:#6DB3A7; --accent-ink:#141A19; --accent-soft:#253A37; --accent-deep:#8CC8BE;
  --a:#D4917C; --a-soft:#3A2B26;
  --b:#CBA55A; --b-soft:#37301F;
  --c:#8FA2CC; --c-soft:#272C3A;
  --ok:#7CBF98; --ok-soft:#21342A; --mid:#D9A454; --mid-soft:#3A2F1B; --no:#A0A6B1; --no-soft:#30343C;
  --on-status:#141A19;
  --say:#2A3741; --say-ink:#C9DCE8;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:1.65rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.92rem}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Header and tabs */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 28px;flex-wrap:wrap;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:1.05rem;padding-block:10px}
.logo{width:28px;height:28px;flex:none;display:block}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{padding:18px 10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
@media (max-width:600px){
  .top .wrap{gap:0}
  .brand{padding-block:12px}
  .tabs{margin:0;width:100%;gap:0;border-top:1px solid var(--line)}
  .tabs a{flex:1;text-align:center;padding:12px 2px;font-size:.92rem}
}

main.wrap{padding-block:28px 64px}
.noscript{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:grid;gap:10px;max-width:60ch}

/* Page headings and the one-line instruction under them */
.pagehead{display:grid;gap:6px;margin-bottom:22px}
.pagehead .lead{color:var(--muted);max-width:65ch}
.pagehead .lead b{color:var(--ink);font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:var(--r);font:inherit;font-weight:600;font-size:.95rem;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center;color:var(--ink)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.go:hover{filter:brightness(.95)}
.btn.ghost{background:var(--surface);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}

/* Phase tints and the step number chip */
.ph-a{--p:var(--a);--p-soft:var(--a-soft)}
.ph-b{--p:var(--b);--p-soft:var(--b-soft)}
.ph-c{--p:var(--c);--p-soft:var(--c-soft)}
.num{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:var(--r);background:var(--p-soft);color:var(--p);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.num.big{width:50px;height:50px;font-size:1.3rem}

/* Surfaces */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.box h3{margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;font-size:.95rem}

/* Callouts: EP guidance (accent) and concerns (amber) */
.callout{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:20px 22px;border-radius:var(--r-lg);background:var(--accent-soft)}
.callout .ico{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.callout .ico svg{width:18px;height:18px}
.callout h2,.callout h3{margin:2px 0 6px}
.callout p{color:var(--ink)}
.callout ul{margin:10px 0;padding-left:1.2em;display:grid;gap:4px}
.callout.amber{background:var(--mid-soft)}
.callout.amber .ico{background:var(--mid);color:var(--on-status)}
.callout .flags{margin-top:10px}
@media (max-width:480px){.callout{grid-template-columns:1fr;padding:18px}}

/* Privacy badge */
.privacy{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);font-size:.92rem;color:var(--muted)}
.privacy svg{width:20px;height:20px;flex:none;color:var(--accent);margin-top:1px}
.privacy b{color:var(--ink);font-weight:600}

/* Home */
.intro{display:grid;gap:14px}
.intro .what{font-size:1.08rem;max-width:62ch}
.how{list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 20px;counter-reset:h}
.how li{counter-increment:h;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:baseline}
.how li::before{content:counter(h);font-weight:600;color:var(--accent-deep);font-variant-numeric:tabular-nums}
.how b{font-weight:600}
.how span{grid-column:2;color:var(--muted);font-size:.93rem}
.phase{margin-top:30px}
.phase>header{display:grid;gap:3px;max-width:65ch;margin-bottom:12px}
.ph-k{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--p)}
.phase>header p{color:var(--muted);font-size:.95rem}
.steplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);text-decoration:none;color:var(--ink);transition:border-color .12s}
.srow:hover{border-color:var(--accent)}
.srow .num{grid-row:span 2}
.srow .tt,.srow .ts{grid-column:2}
.srow .tt{font-weight:600;line-height:1.3}
.srow .ts{font-size:.88rem;color:var(--muted);line-height:1.3}
.srow .pill{grid-column:3;grid-row:span 2}

/* Step page */
.crumbs{margin-bottom:16px;font-size:.93rem}
.crumbs a{font-weight:500;text-decoration:none}
.stephead{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.stephead>div{min-width:0;display:grid;gap:4px}
.stephead .q{color:var(--muted);max-width:60ch}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.seg button{padding:12px 12px;border:0;background:none;font:inherit;font-weight:500;font-size:.95rem;color:var(--muted);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.ticks,.warns{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ticks li,.warns li{position:relative;padding-left:28px}
.ticks li::before{content:"";position:absolute;left:3px;top:5px;width:6px;height:11px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.warns li::before{content:"!";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mid);color:var(--mid);font-weight:700;font-size:.75rem;display:grid;place-items:center}
.extra{margin-top:16px}
.stages{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.stages li{counter-increment:s;background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:.93rem}
.stages li b{display:block;font-weight:600}
.stages li b::before{content:counter(s) ". ";color:var(--p)}
.stories{display:grid;gap:8px}
.stories div{background:var(--surface-2);border-radius:var(--r);padding:10px 14px;font-size:.95rem}
.stories b{color:var(--p);font-weight:600}
.need{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:.95rem}
.tasks{list-style:none;padding:0;margin:0;counter-reset:t;display:grid;gap:10px}
.tasks>li{counter-increment:t;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 14px 52px;position:relative;display:grid;gap:8px}
.tasks>li::before{content:counter(t);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.pt{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;align-items:start}
.pt-l{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.pt-say .pt-x{background:var(--say);color:var(--say-ink);padding:8px 12px;border-radius:var(--r);font-weight:500;justify-self:start}
.pt-say .pt-l{color:var(--say-ink)}
.pt-note .pt-l{color:var(--mid)}
.pt-tip .pt-l{color:var(--accent-deep)}
@media (max-width:520px){.pt{grid-template-columns:1fr;gap:3px}.tasks>li{padding-left:16px;padding-top:50px}}
.adjust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.adjust div{border-radius:var(--r);padding:12px 14px;background:var(--surface-2);font-size:.93rem}
.adjust b{display:block;font-weight:600}
.acts{display:grid;gap:12px}
.act{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;border:1px solid var(--line);display:grid;gap:10px}
details.why{margin-top:20px;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);padding:12px 16px}
details.why summary{cursor:pointer;font-weight:600}
details.why p{margin-top:10px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px}

/* Glossary */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1px dotted var(--accent);cursor:help;font-weight:inherit;line-height:inherit}
.term:hover{color:var(--accent-deep)}
.gloss{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gin{max-width:600px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:16px 18px;box-shadow:0 16px 40px -12px rgba(0,0,0,.35);display:grid;gap:8px}
.gin h3{text-transform:capitalize}
.gin .btn{justify-self:start}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--no-soft);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.s-secure{background:var(--ok-soft);color:var(--ok)}
.pill.s-emerging{background:var(--mid-soft);color:var(--mid)}
.pill.s-notyet{background:var(--no-soft);color:var(--no)}

/* Check */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-weight:600;font-size:.95rem}
.field small{color:var(--muted);font-size:.86rem}
input,select,textarea{width:100%;min-height:42px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;padding:8px 10px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.checkhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.checkhead .lead{color:var(--muted);margin-top:4px;max-width:60ch}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sq{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);font:inherit;font-weight:600;font-size:.85rem;color:var(--muted);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.sq.s-secure{background:var(--ok);border-color:var(--ok);color:var(--on-status)}
.sq.s-emerging{background:var(--mid);border-color:var(--mid);color:var(--on-status)}
.sq.s-notyet{background:var(--no-soft);border-color:var(--no);color:var(--ink);border-style:dashed}
.sq.cur{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.ck{display:grid;gap:18px}
.ck-h{display:flex;gap:14px;align-items:center}
.chips{display:grid;gap:8px}
.chip{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px 12px;font:inherit;font-size:.95rem;text-align:left;cursor:pointer;color:var(--ink);line-height:1.4}
.chip::before{content:"";flex:none;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line-strong);margin-top:1px;background:var(--surface)}
.chip[aria-pressed="true"]{border-color:var(--mid);background:var(--mid-soft)}
.chip[aria-pressed="true"]::before{background:var(--mid);border-color:var(--mid)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.rate{grid-template-columns:1fr}}
.rate button{text-align:left;padding:12px 14px;border-radius:var(--r-lg);border:1px solid var(--line-strong);background:var(--surface);font:inherit;cursor:pointer;color:var(--ink);display:grid;gap:2px}
.rate b{font-weight:600;font-size:1.02rem}
.rate small{color:var(--muted);font-size:.86rem}
.rate .r-secure[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.rate .r-emerging[aria-pressed="true"]{background:var(--mid-soft);border-color:var(--mid)}
.rate .r-notyet[aria-pressed="true"]{background:var(--no-soft);border-color:var(--no)}
.next{padding:16px 18px;border-radius:var(--r-lg);background:var(--accent-soft);display:grid;gap:12px}
.hint{color:var(--muted);font-size:.9rem;margin-top:-8px}
.startbox{display:flex;gap:16px;align-items:center;padding:20px 22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--p);box-shadow:var(--shadow)}
.startbox>div{display:grid;gap:4px;min-width:0}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.timeline li{border-radius:var(--r);padding:10px 12px;background:var(--surface-2);display:grid}
.timeline li b{font-weight:600}
.timeline li span{color:var(--muted);font-size:.88rem}
.bul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.flags{display:grid;gap:8px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:.95rem}
.flag input{width:18px;height:18px;min-height:0;flex:none;margin-top:3px;accent-color:var(--accent)}
.flag em{display:block;font-style:normal;font-size:.84rem;color:var(--mid);font-weight:600}

/* Record */
.sheet{display:grid;gap:20px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0}
.meta div{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;min-width:0}
.meta dt{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:2px 0 0;font-weight:600}
.meta input{min-height:34px;padding:4px 8px;margin-top:2px;font-size:.92rem}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.sn{white-space:nowrap;font-weight:500}
td.rs{white-space:nowrap}
td .seen{margin:4px 0 0;padding-left:1.1em;color:var(--muted);font-size:.9rem}
tr.unchecked td{color:var(--muted)}
.confirm{background:var(--mid-soft);border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:10px;margin-bottom:16px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:28px;display:grid;gap:12px;justify-items:start}

/* Practise */
.quiz{display:grid;gap:16px}
.quiz-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line-strong);border:0;padding:0;cursor:pointer}
.dot.r{background:var(--ok)}
.dot.w{background:var(--mid)}

<script>
/* ---------- Content ---------- */
const PH={
  a:{name:"The meaning of number",range:"Steps 1 to 5",blurb:"What a number means: comparing groups, counting, and knowing how many there are."},
  b:{name:"Small numbers working together",range:"Steps 6 to 9",blurb:"The links between small numbers that children need before they can add and take away with confidence."},
  c:{name:"Bigger numbers and problems",range:"Steps 10 to 15",blurb:"Taking those links up to 100, and using them to solve problems."}
};

const GLOSS={
  "subitising":"Seeing how many are in a small group straight away, without counting. Say it SOO-bit-eye-zing.",
  "cardinality":"Knowing that the last number you say when you count tells you how many there are altogether.",
  "numeral":"The written sign for a number, such as 7.",
  "numerals":"The written signs for numbers, such as 3, 7 and 10.",
  "number line":"A line with numbers spaced evenly along it, such as 0 at one end and 10 at the other. It shows how big numbers are compared with each other.",
  "number track":"A straight row of equal numbered squares, like a simple board game. Each square holds one number.",
  "part-whole":"Knowing that a number is made of smaller numbers. 5 is 4 and 1, and also 3 and 2.",
  "ten-frame":"A grid of 2 rows of 5 boxes. Children put counters in it so they can see numbers in fives and tens. 7 is a full row of 5 and 2 more.",
  "counting on":"Starting from the first number and counting the rest. For 5 + 3, the child says 'six, seven, eight'.",
  "counting all":"Counting both groups from 1 to find the total. For 5 + 3, the child counts 'one, two, three' all the way to eight.",
  "doubles":"Adding a number to itself, such as 6 + 6 or 7 + 7.",
  "near doubles":"Facts next to a double. If you know 7 + 7 = 14, then 7 + 8 is one more: 15.",
  "making ten":"Going to 10 first. For 8 + 5, take 2 from the 5 to make 10, then add the 3 left over: 13.",
  "place value":"Where a digit sits tells you its value. In 43, the 4 means four tens and the 3 means three ones.",
  "by rote":"Learnt by heart through repetition, without understanding. Rote learning often falls apart when the numbers change.",
  "number bonds":"Pairs of numbers that make a total, like 3 and 2 making 5, or 6 and 4 making 10.",
  "additive reasoning":"Understanding how adding and taking away connect, and working out which one a story needs.",
  "secure":"The child does it confidently and correctly, without help, more than once.",
  "emerging":"The child can do some of it, or can do it only with help."
};

/* Parts: [type, text]. Types: do, say, note, tip. {term} or {term|shown text} links to the glossary. */
const STEPS=[
{n:1,phase:"a",title:"Comparing and matching",short:"More, fewer, one each",
 q:"Can the child tell which group has more, and match one thing to another?",
 looks:["Says which of two groups has more when the difference is big, like 3 and 8.","Gives one cup to each teddy.","Puts five towers of 1 to 5 cubes in order of height."],
 watch:["Picks the longer row as 'more', whatever the number of things in it.","Misses things out or doubles up when matching."],
 need:"Counters and cubes.",
 tasks:[
  [["do","Put out 3 counters spread wide and 8 counters close together."],["say","Which has more?"],["note","Does the child choose the group that takes up more space?"]],
  [["do","Mix up five towers of 1 to 5 cubes."],["say","Put these in order, from smallest to biggest."]]
 ],
 acts:[
  {name:"Enough for everyone?",parts:[["do","Give each toy one cup. Sometimes have too many cups, too few, or just enough."],["say","Does everyone have one? How can we check?"]]},
  {name:"Match to compare",parts:[["do","Start with two groups that are very different in number. Pair the objects up to check which has more, fewer or the same."],["tip","Later, put a few big objects against more small ones, so size doesn't give the answer away."]]}
 ]},
{n:2,phase:"a",title:"Saying the counting words",short:"Number words in order",
 q:"Can the child say the number words in the right order, every time?",
 looks:["Says the number words in the same order each time, first to 10 and then to 20.","Can start counting from a number other than 1.","Tells you the number after 6 without going back to 1.","Counts back from 10."],
 watch:["Skips or repeats words, like 'one, two, four, five'.","Has to start at 1 to find the next number.","Mixes up the teens, like 'eleventeen'."],
 need:"Nothing. Just you and the child.",
 tasks:[
  [["say","Count for me, as far as you can."],["note","Write down the first mistake."]],
  [["say","Start at 4 and keep counting."],["do","Then try again from 7."]],
  [["say","What number comes after 6?"],["note","Does the child go back to 1 to find it?"]],
  [["say","Count back from 10."]]
 ],
 acts:[
  {name:"Count, pause, carry on",parts:[["do","Take turns to say a short count. Pause after 4 and ask the child to carry on from 5. Change the starting number, and go further over time."]]},
  {name:"Count back in a rhyme",parts:[["do","Use a countdown rhyme the child knows, with objects or pictures. Start from different numbers, like 7 or 3. Pause so the child can say the next number."],["tip","Counting back is harder to hold in your head, so give extra help here."]]}
 ],
 why:"Saying the words in order is not the same as understanding them. A child can count to 20 and still grab a handful when you ask for five. Check steps 4 and 5 as well."},
{n:3,phase:"a",title:"Seeing small numbers at a glance",short:"Knowing 1 to 5 without counting",
 q:"Can the child see how many are in a small group without counting?",
 term:"subitising",
 looks:["Sees 1, 2 or 3 objects and says how many straight away.","Later, does the same with up to 5.","Knows familiar patterns, like dice dots and rows on a {ten-frame}."],
 watch:["Counts one by one, even for 2 things.","Says the same number, like 'two', for every small group."],
 need:"Dot cards showing 1 to 5, some in dice patterns and some jumbled. Something to cover them.",
 tasks:[
  [["do","Show a card with 2 dots for two seconds, then cover it."],["say","How many?"],["do","Repeat with 1, 3, 4 and 5 dots, in a mixed order."]],
  [["do","Use both dice patterns and jumbled arrangements."],["note","Does the child count, or just know?"]]
 ],
 acts:[
  {name:"See it, show it",parts:[["do","Show 1 to 3 objects for a moment, then cover them. The child shows the same number with fingers or counters. Use tidy and jumbled arrangements."],["tip","Go up to 4 and 5 when the child is ready."]]},
  {name:"What did you see?",parts:[["do","Show a small dot pattern."],["say","How many? What did you notice?"],["tip","Accept 'I just saw three'. Later, talk about the parts: 'I saw two and two, so four.'"]]}
 ],
 why:"This is called {subitising}. Children don't move through the steps in a fixed line. A child may see three dots at a glance before they can count a set of five."},
{n:4,phase:"a",title:"Counting a set",short:"One number for each object",
 q:"Can the child count a group of objects accurately?",
 looks:["Touches or moves each object once while saying one number word.","Gets the same total when counting from the other end.","Counts a scattered set, and a set of mixed objects."],
 watch:["Says more words than they touch, or touches more objects than they say words.","Counts an object twice.","Loses track of which objects they've counted in a scattered set."],
 need:"7 cubes.",
 tasks:[
  [["do","Put out 7 cubes in a row."],["say","How many are there?"],["note","Does each touch match one number word?"]],
  [["do","Scatter the 7 cubes."],["say","How many are there?"],["note","Does the child keep track, for example by moving counted cubes aside?"]],
  [["say","Count them again, starting from this end."],["note","Does the child expect the same total?"]]
 ],
 acts:[
  {name:"Move and count",parts:[["do","Move each object from one area into a tray, saying one number word for each move. Start with a row, then scattered objects. Then count pictures, marking each one as you count it."]]},
  {name:"Be the counting teacher",parts:[["do","A puppet counts a set. Sometimes it's right. Sometimes it misses one or counts one twice."],["say","Did Teddy count it right? What went wrong? Show Teddy how to do it."]]}
 ],
 why:"To count a set, a child needs to count each object once, say the words in a fixed order, know that the order doesn't change the total, and know that you can count any kind of object (Gelman and Gallistel, 1978)."},
{n:5,phase:"a",title:"Knowing how many",short:"The last number is the total",key:true,
 q:"Does the child know that the last number they say tells you how many?",
 term:"cardinality",
 looks:["After counting, gives the last number as the answer to 'How many?' without counting again.","Gives you the right number of objects from a bigger pile.","Knows the number stays the same when you spread the objects out or push them together."],
 watch:["Counts again when you ask 'How many?'","Grabs a handful when you ask for five.","Says a spread-out row has more."],
 need:"A pile of 15 cubes and something to cover them.",
 tasks:[
  [["do","After the child counts a set, cover it."],["say","So how many are there?"],["note","Does the child answer without counting again?"]],
  [["do","Put out a pile of 15 cubes."],["say","Give me 3."],["do","Then ask for 5, then 7."],["note","Write down the biggest number the child gives correctly. This 'give me' task is the clearest check for this step."]],
  [["do","Make two rows of 6 cubes, side by side, matched one to one."],["say","Are there more here, more here, or are they the same?"],["do","Spread one row out and ask again."]]
 ],
 acts:[
  {name:"Collect an order",parts:[["say","Please bring me four cars."],["do","Show how you count and stop at four, then sum up: 'Four cars altogether.' Take turns to give and check orders."]]},
  {name:"Same number, new arrangement",parts:[["do","Count a set, then spread it out or move it around."],["say","Have we added any or taken any away? How many now?"],["tip","Check together by counting if the child is unsure."]]}
 ],
 why:"This is called {cardinality}. Children learn it one number at a time: what 'one' means, then 'two', then 'three' and 'four', before they get the rule for all numbers (Le Corre and Carey, 2007). A child who counts a row easily may still not know that the last number tells you how many (Nunes and Bryant, 2009)."},
{n:6,phase:"b",title:"Linking numerals, words and amounts",short:"7, seven, and seven things",
 q:"Can the child match a written number to its name and to that many objects?",
 looks:["Reads the {numerals} 0 to 10.","Matches each numeral to its word and to a set of objects.","Puts numeral cards in order, and shows a numeral on their fingers."],
 watch:["Names a numeral but can't make a set that size.","Puts cards in order from memory, but can't find a missing card."],
 need:"Numeral cards 0 to 10, and cubes.",
 tasks:[
  [["do","Show numeral cards 0 to 10 in a mixed order."],["say","What number is this?"]],
  [["say","Put these cards in order."],["do","Take one card away while the child looks away."],["say","Which one is missing?"]],
  [["do","Show the card for 6."],["say","Give me this many cubes."],["say","Show me this many fingers."]]
 ],
 acts:[
  {name:"Fill the labelled pot",parts:[["do","Label pots with numerals and put the right number of objects in each. Include 0 as an empty pot."],["tip","Sometimes put in the wrong number for the child to spot and fix."]]},
  {name:"Find another way",parts:[["do","Pick a numeral and match it to objects, fingers and dot cards. Then swap: show an amount and ask the child to find its numeral."],["tip","Mix up the arrangements, and the way the numerals are written."]]}
 ]},
{n:7,phase:"b",title:"Comparing numbers on a line",short:"Bigger, smaller, and where it goes",
 q:"Can the child tell which number is bigger, and place numbers on a line?",
 looks:["Says which of two numbers is bigger without counting objects.","Places numbers on a {number line} marked 0 and 10 with roughly even gaps.","Uses more, fewer, bigger and smaller correctly."],
 watch:["Squashes 6, 7, 8 and 9 up near 10.","Works out which number is bigger by counting up from 1 every time."],
 need:"Paper and a pen.",
 tasks:[
  [["say","Which is bigger, 5 or 8?"],["do","Repeat with 3 and 9, then 7 and 6."],["note","Does the child count up from 1?"]],
  [["do","Draw a line with 0 at one end and 10 at the other."],["say","Show me where 7 goes."],["do","Repeat with 2 and 5."]]
 ],
 acts:[
  {name:"Race and count on",parts:[["do","Play on a straight 1 to 10 {number track} with equal squares, using a spinner showing 1 or 2. The child says the numbers on the squares as they move: from 4, a move of two is '5, 6'."],["tip","Children learn more when they say the numbers on the board as they move, not 'one, two' (Laski and Siegler, 2014)."]]},
  {name:"Build, then estimate",parts:[["do","Make a 0 to 10 line with equal gaps, and link each place to an amount. Later, take most of the labels off and keep 0, 5 and 10."],["say","Where would 7 go? How do you know?"]]}
 ],
 why:"Young children first squash the bigger numbers together at the end of the line. Most children space 0 to 10 evenly by age 5 or 6. Children with maths difficulties go through the same change, later (Siegler and Braithwaite, 2017)."},
{n:8,phase:"b",title:"Numbers inside numbers",short:"5 is 3 and 2, and 4 and 1",
 q:"Does the child know that a number is made of smaller numbers?",
 term:"part-whole",
 looks:["Knows 5 is 4 and 1, and also 3 and 2.","Finds the pairs that make 5, then 10. First with objects and fingers, then without.","Sees a {ten-frame} showing 7 as 5 and 2."],
 watch:["Counts both parts from 1 to find the total.","Doesn't see that 3 and 2 makes the same as 2 and 3."],
 need:"5 cubes and a cup. A ten-frame and 7 counters.",
 tasks:[
  [["do","Show 5 cubes. Hide some under a cup."],["say","I had 5. How many are hiding?"],["do","Repeat with different amounts."]],
  [["do","Show a ten-frame with 7 counters."],["say","How many? How did you know?"],["note","Does the child see 5 and 2?"]],
  [["say","Show me 5 on your fingers another way."]]
 ],
 acts:[
  {name:"Split and describe",parts:[["do","Share five counters between two mats. Move one counter at a time to find each split, including 5 and 0."],["say","Three and two make five."],["do","Swap the mats round."],["say","What changed? What stayed the same?"]]},
  {name:"Hide a part",parts:[["do","Agree the total, then cover some counters."],["say","Five altogether, two showing. How many are hidden?"],["tip","Lift the cover to check. Use a smaller total if the child needs it."]]}
 ],
 why:"This is called {part-whole} understanding. It's the base for later work on tens and ones."},
{n:9,phase:"b",title:"Early adding and taking away",short:"From counting all to counting on",
 q:"How does the child add and take away small numbers?",
 looks:["Solves simple stories with objects, like 'You have 4 sweets and I give you 3 more'.","Moves on through the four stages below."],
 stages:[["Counting all","Counts both groups from 1."],["Counting on","Starts from the first or bigger number and counts the rest."],["Working it out","Uses a fact they know: 6 + 7 from 6 + 6."],["Just knowing","Knows the answer."]],
 watch:["Still counts everything from 1 in Year 2.","Includes the starting number when counting on, so 5 + 3 becomes '5, 6, 7'.","Recites facts learnt by heart but can't use them to solve a problem."],
 need:"Cubes and a cloth.",
 tasks:[
  [["do","Tell a story with objects."],["say","You have 4 sweets and I give you 3 more. How many now?"]],
  [["do","Put 5 cubes under a cloth and 3 next to it."],["say","There are 5 under here and 3 here. How many altogether?"],["note","Does the child count on from 5, or want to lift the cloth?"]],
  [["say","What's 4 + 4?"],["say","So what's 4 + 5?"],["note","Does the child use the first answer to get the second?"]],
  [["say","How did you work it out?"],["do","Ask this after every answer."]]
 ],
 acts:[
  {name:"Act, show, write",parts:[["do","Act out joining and taking-away stories with small numbers. Show each story with counters, then a drawing, then the number sentence."],["say","What changed? What does each number show?"]]},
  {name:"Keep the first number",parts:[["do","Put out five counters and cover them. Add two counters the child can see."],["say","Five... six, seven."],["do","For taking away, start with seven and take two away. Lift the cover or rebuild the set to check."]]}
 ],
 why:"Stages 3 and 4 depend on stage 2, {counting on}. Teach {number bonds} by working out how numbers relate, and leave memorising till later (Baroody and colleagues, 2009)."},
{n:10,phase:"c",title:"Ten as a group, and numbers to 20",short:"14 is 10 and 4",
 q:"Does the child see 10 as one group, and teen numbers as ten and some more?",
 looks:["Sees 10 as one group as well as ten ones.","Knows 14 is 10 and 4, and can make it with a full {ten-frame} and 4 more.","Counts on from 10 to find a teen number, without counting the ten from 1."],
 watch:["Counts all 14 cubes from 1 each time.","Writes fourteen as 41.","Mixes up teen and tens numbers, like fifteen and fifty."],
 need:"A ten-frame, counters, paper and a pen.",
 tasks:[
  [["do","Show a full ten-frame and 4 loose counters."],["say","How many?"],["note","Does the child start from 10, or count from 1?"]],
  [["do","Give the child a ten-frame and a pile of counters."],["say","Make 16."]],
  [["say","Write fourteen."],["say","Now write forty."]]
 ],
 acts:[
  {name:"Make and swap ten",parts:[["do","Count ten loose sticks and bundle them. Swap the bundle for ten loose sticks and back again."],["say","One ten is ten ones."],["do","Add four loose sticks to make fourteen."]]},
  {name:"Build, name, match",parts:[["do","Show fourteen on two ten-frames, with one frame full."],["say","Fourteen is ten and four."],["do","Match it to the numeral 14. Build other teen numbers and talk about what stays the same."]]}
 ],
 why:"English teen names hide the ten. 'Fourteen' says the 4 first, and 'eleven' and 'twelve' give no clue at all. Point the ten out every time."},
{n:11,phase:"c",title:"Number facts to 20",short:"Doubles and making ten",
 q:"Can the child work out new facts from ones they already know?",
 looks:["Works out new facts from ones they know.","Uses {doubles} and {near doubles}: 7 + 8 is 7 + 7 and 1 more.","Goes through ten ({making ten}): 8 + 5 is 8 + 2 to make 10, then 3 more.","With practice, knows many facts quickly."],
 watch:["Counts on in ones for every fact, even 9 + 9.","Gives fast answers that are often wrong, because the facts were learnt without understanding.","Knows 8 + 2 = 10 but doesn't use it for 8 + 5."],
 need:"Paper to jot down answers.",
 tasks:[
  [["say","What's 6 + 6?"],["say","So what's 6 + 7?"],["note","Does the child use the double?"]],
  [["say","What's 8 + 5? How did you work it out?"],["note","Listen for making 10."]],
  [["do","Ask ten facts to 20 in a mixed order."],["note","Write down which ones the child just knows and which they work out."]]
 ],
 acts:[
  {name:"Use a fact you know",parts:[["do","Build 6 + 6, then change it to 6 + 7."],["say","What changed? What must happen to the answer?"],["do","Link the take-away facts too, like 13 − 6 = 7."]]},
  {name:"Make ten, then practise",parts:[["do","Show 8 + 5 by splitting the 5 into 2 and 3. For 13 − 5, take away 3 to get to 10, then 2 more."],["tip","Once the child is accurate, come back to these facts in short, mixed practice."]]}
 ],
 why:"Accurate and understood first, fast second (Haring and colleagues, 1978). Once facts come quickly, the child's memory is free for solving problems."},
{n:12,phase:"c",title:"Word problems",short:"Choosing add or take away",
 q:"Can the child solve adding and taking-away stories, and choose what to do?",
 term:"additive reasoning",
 looks:["Solves the three kinds of story below with numbers to 10, using objects or a drawing.","Solves stories where the start is missing: 'I had some sweets. I ate 2 and now I have 3. How many did I have?'","Knows adding and taking away undo each other: if 3 + 2 = 5, then 5 − 2 = 3."],
 stories:[["Combine","Ali has 3 red pens and 2 blue pens. How many pens altogether?"],["Change","Ali has 3 cars. His gran gives him 2 more. How many does he have now?"],["Compare","Mia has 5 stickers and Tom has 3. How many more does Mia have?"]],
 watch:["Picks add or take away from a key word, so 'more' always means add.","Adds every number in the problem.","Can do 5 − 2, but doesn't see it in a comparing story."],
 need:"Cubes, or paper to draw on.",
 tasks:[
  [["do","Let the child use cubes or draw."],["say","There are 4 red cubes and 3 blue cubes. How many altogether?"]],
  [["say","I had some sweets. I ate 2. Now I have 4. How many did I have at the start?"]],
  [["say","Ella has 7 stickers. Sam has 4. How many more does Ella have?"]],
  [["say","4 + 3 = 7. So what is 7 − 3?"],["note","Does the child work it out, or use the link?"]]
 ],
 acts:[
  {name:"Same numbers, different stories",parts:[["do","Use 3, 2 and 5 in combine, change and compare stories. Act them out and draw them."],["tip","For compare stories, line the two rows up side by side and keep both in view, so the child sees how many more."]]},
  {name:"Move the missing number",parts:[["do","Tell linked stories: 'Three cars arrive, then two more.' 'Some cars arrive, then two more make five.' 'Three cars arrive, then some more make five.'"],["say","What do we know? What do we need to find?"]]}
 ],
 why:"Stories with a missing start or a missing middle are harder than ones with a missing answer, even with the same numbers. Teach all three (Vergnaud, 1997)."},
{n:13,phase:"c",title:"Counting in tens, and numbers to 100",short:"28, 29, 30, and 3, 13, 23",
 q:"Can the child count past each ten, and count in tens from any number?",
 looks:["Counts to 100 and back, crossing each ten without stopping: 28, 29, 30.","Counts in tens from 0 and from other numbers, like 3, 13, 23.","Counts in twos and fives.","Uses the pattern of the numbers to work out what comes next."],
 watch:["Gets stuck at a new ten: '28, 29, twenty-ten'.","Counts in tens from 10 but can't start from 3.","Recites fives from memory but can't say what comes after 35."],
 need:"Nothing needed. Bundles of ten sticks help with teaching.",
 tasks:[
  [["say","Count from 27. Keep going until I say stop."],["do","Stop the child at 43."]],
  [["say","Count in tens, starting at 6."]],
  [["say","Count in fives from zero."],["say","What comes after 35?"]]
 ],
 acts:[
  {name:"What changes?",parts:[["do","Start with three loose sticks and add bundles of ten: 3, 13, 23, 33."],["say","What changes? What stays the same?"],["do","Take bundles away to count back."]]},
  {name:"Build the counting pattern",parts:[["do","Count pairs of objects, groups of five and bundles of ten, pointing to each group."],["tip","To practise crossing a ten, build 28, 29 and 30, swapping ten ones for a bundle of ten."]]}
 ]},
{n:14,phase:"c",title:"Tens and ones, and adding to 100",short:"The 4 in 43 means four tens",
 q:"Does the child understand tens and ones, and use them to add?",
 term:"place value",
 looks:["Knows the 4 in 43 means four tens.","Makes 43 with tens and ones in more than one way, like 3 tens and 13 ones.","Places numbers on a 0 to 100 line with roughly even gaps.","Adds and takes away 10 without counting in ones, and adds two 2-digit numbers using tens and ones."],
 watch:["Reads 43 as 'four, three'.","Counts on in ones to add 10.","Writes forty-three as 403."],
 need:"Tens sticks and single cubes, paper and a pen.",
 tasks:[
  [["do","Write 43. Give the child tens sticks and single cubes."],["say","What does the 4 stand for? Show me with these."]],
  [["do","Draw a line with 0 at one end and 100 at the other."],["say","Show me where 50 goes."],["do","Repeat with 20 and 85."]],
  [["say","What is 10 more than 36? What is 10 less than 52?"],["note","Does the child count in ones?"]],
  [["say","What is 23 + 14? How did you work it out?"]]
 ],
 acts:[
  {name:"Same number, different groups",parts:[["do","Build 43 as four tens and three ones. Swap one ten for ten ones to make three tens and thirteen ones."],["say","Why is it still 43?"]]},

function flagsBox(){
 const auto=autoFlags();
 return `<section class="callout amber">${ICO_NOTE}<div><p class="eyebrow">Concerns to note</p><h3>Anything else you noticed?</h3><p class="small">Tick anything that applies. Share it with the class teacher and SENCo. If these concerns continue after teaching, your SENCo can raise them with your link EP.</p>
 <div class="flags">${FLAGS.map(([k,l])=>`<label class="flag"><input type="checkbox" data-flag="${k}"${flagOn(k)?" checked":""}><span>${l}${auto[k]?"<em>Suggested by your answers</em>":""}</span></label>`).join("")}</div></div></section>`;
}
function viewResults(){
 const t=teachStart(), ns=checkedList();
 let top;
 if(t){
  const s=STEPS[t-1];
  top=`<section class="startbox ph-${s.phase}">${num(t,true)}<div><p class="eyebrow">Teaching starts at</p><h2>Step ${t}: ${s.title}</h2><p class="muted">${s.q}</p></div></section>
   <section class="stack"><h2>Activities for step ${t}</h2><div class="acts ph-${s.phase}">${s.acts.map(a=>`<article class="act"><h3>${a.name}</h3>${parts(a.parts)}</article>`).join("")}</div><p class="small"><a href="#step-${t}">Open step ${t} in full</a></p></section>`;
 } else if(ns.length){
  const max=ns[ns.length-1];
  top=`<section class="startbox ph-c"><div><p class="eyebrow">Result</p><h2>Every step you checked was secure</h2>
   <p class="muted">${max<15?`Check step ${max+1} next to find where teaching should start.`:"The child is secure across all 15 steps."}</p>
   ${max<15?`<div style="margin-top:8px"><button type="button" class="btn go" data-act="goto" data-v="${max+1}">Check step ${max+1}</button></div>`:""}</div></section>`;
 } else {
  top=`<section class="empty"><h2>No steps marked yet</h2><p>Go back and mark at least one step as secure, emerging or not yet.</p><button type="button" class="btn go" data-act="back-run">Back to checking</button></section>`;
 }
 return `
 <div class="checkhead"><div><p class="eyebrow">Plan for ${esc(S.pupil.initials)} · ${yearName(S.pupil.year)}</p><h1>What to teach next</h1><p class="lead">Teaching starts at the first step that isn't secure. Use the activities below, then check again in about six weeks.</p></div>
 <div class="row"><button type="button" class="btn ghost sm" data-act="back-run">Back to checking</button><a class="btn go sm" href="#record">See the record</a></div></div>
 ${strip()}
 <div class="stack">${top}${t?sessionBox():""}${flagsBox()}
 <div class="row"><a class="btn go" href="#record">See the record</a></div></div>`;
}

function viewRecord(){
 const paper=PUBLIC?`<a href="number-steps-record-sheet.pdf" target="_blank" rel="noopener">Download the printable record sheet (PDF)</a>.`:"Ask your SENCo for the printable Number Steps record sheet.";
 if(!S)return `${pagehead("Record","When you check a pupil, their results appear here as a record you can copy into your school's system.")}
  ${PRIVACY}
  <div class="empty" style="margin-top:16px"><p>No pupil has been checked on this device yet.</p><p class="muted small">Prefer paper? ${paper}</p><a class="btn go" href="#check">Check a pupil</a></div>`;
 const t=teachStart();
 const ticked=FLAGS.filter(([k])=>flagOn(k));
 return `
 <div class="checkhead noprint"><div><p class="eyebrow">Record for ${esc(S.pupil.initials)}</p><h1>Record</h1><p class="lead">Copy this record into your school's system. It isn't saved anywhere else.</p></div>
  <div class="row"><button type="button" class="btn go sm" data-act="copy" id="copybtn">Copy as text</button>${PUBLIC?`<button type="button" class="btn ghost sm" data-act="print">Print</button>`:""}<button type="button" class="btn ghost sm" data-act="back-run">Change answers</button><button type="button" class="btn ghost sm" data-act="new">Start a new pupil</button></div></div>
 <div class="noprint" style="margin-bottom:16px">${PRIVACY}</div>
 ${confirmNew?`<div class="confirm noprint"><p><b>Clear this record?</b> Copy it first if you need to keep it. This can't be undone.</p><div class="row"><button type="button" class="btn go sm" data-act="new-yes">Yes, clear it</button><button type="button" class="btn ghost sm" data-act="new-no">Keep it</button></div></div>`:""}
 <article class="card sheet">
  <header class="stack" style="gap:10px"><p class="eyebrow">Number Steps record</p>
  <dl class="meta">
   <div><dt>Pupil</dt><dd>${esc(S.pupil.initials)}</dd></div>
   <div><dt>Year</dt><dd>${yearName(S.pupil.year)}</dd></div>
   <div><dt>Checked on</dt><dd>${nice(S.pupil.date)}</dd></div>
   <div><dt>Checked by</dt><dd>${esc(S.pupil.adult)||"–"}</dd></div>
   <div><dt><label for="rv">Review due</label></dt><dd><input id="rv" type="date" value="${esc(S.review||"")}" data-review></dd></div>
  </dl></header>
  <section class="startbox ${t?"ph-"+STEPS[t-1].phase:"ph-c"}" style="box-shadow:none">${t?num(t,true):""}<div>
   <p class="eyebrow">Teaching starts at</p>
   <h3>${t?`Step ${t}: ${STEPS[t-1].title}`:"Not found yet. Check the next step up."}</h3>
   ${t?`<p class="muted small">Activities: ${STEPS[t-1].acts.map(a=>a.name).join(", ")}.</p>`:""}
  </div></section>
  <div class="tablewrap"><table>
   <thead><tr><th>Step</th><th>Result</th><th>What you saw</th></tr></thead>
   <tbody>${STEPS.map(s=>{const r=S.res[s.n]||{};const seen=(r.seen||[]).map(i=>plain(s.watch[i]));
    return `<tr class="${r.s?"":"unchecked"}"><td class="sn">${s.n}. ${s.title}</td><td class="rs">${r.s?pill(r.s):"Not checked"}</td><td>${esc(r.notes||"")}${seen.length?`<ul class="seen">${seen.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</td></tr>`}).join("")}</tbody>
  </table></div>
  <section class="callout amber">${ICO_NOTE}<div><p class="eyebrow">Concerns to note</p>${ticked.length?`<ul>${ticked.map(f=>`<li>${f[1]}</li>`).join("")}</ul>`:`<p class="muted" style="margin-top:4px">Nothing ticked.</p>`}<p class="small">Share these with the class teacher and SENCo.</p></div></section>
  <section><h3 style="margin-bottom:8px">At the review</h3><ul class="bul small">
   <li><b>Secure:</b> move on to the next step.</li>
   <li><b>Some progress, not yet secure:</b> carry on at the same step for another block.</li>
   <li><b>Little or no progress:</b> check the child is at the right step, and change the approach.</li>
   <li><b>Little or no progress after two blocks:</b> ask your SENCo about involving your link EP.</li>
  </ul><p class="muted small" style="margin-top:8px">Use the same tasks and numbers as this check, so you can compare.</p></section>
 </article>
 <p class="muted small noprint" style="margin-top:14px">Prefer paper? ${paper}</p>`;
}
function recordText(){
 const t=teachStart(), L=[];
 L.push("NUMBER STEPS RECORD");
 L.push(`Pupil: ${S.pupil.initials}   Year: ${yearName(S.pupil.year)}   Checked: ${nice(S.pupil.date)}   By: ${S.pupil.adult||"-"}   Review due: ${nice(S.review)}`);
 L.push("");
 L.push("Teaching starts at: "+(t?`Step ${t}, ${STEPS[t-1].title}`:"not found yet"));
 if(t)L.push("Activities: "+STEPS[t-1].acts.map(a=>a.name).join(", "));
 L.push("");
 STEPS.forEach(s=>{const r=S.res[s.n];if(!r||!r.s)return;
  L.push(`Step ${s.n}, ${s.title}: ${ST[r.s].l}`);
  (r.seen||[]).forEach(i=>L.push("  - "+plain(s.watch[i])));
  if(r.notes)L.push("  Notes: "+r.notes.replace(/\s+/g," ").trim());
 });
 const ticked=FLAGS.filter(([k])=>flagOn(k));
 L.push("");
 L.push("Concerns to note: "+(ticked.length?ticked.map(f=>f[1]).join("; "):"nothing ticked"));
 return L.join("\n");
}

function viewPractise(){
 const si=P.si, q=SPOT[si], ans=P.spot[si];
 const right=Object.keys(P.spot).filter(i=>P.spot[i]===SPOT[i].a).length, done=Object.keys(P.spot).length;
 const mi=P.mi, m=MYTHS[mi], mans=P.myth[mi];
 const mright=Object.keys(P.myth).filter(i=>(P.myth[i]==="myth")===MYTHS[i].m).length, mdone=Object.keys(P.myth).length;
 return `
 ${pagehead("Practise","Optional, for your own learning when you're not with a pupil. Read each scenario and pick the step it points to. Nothing is marked or shared.")}
 <div class="stack">
 <section class="card quiz">
  <div class="quiz-h"><div><p class="eyebrow">Spot the step</p><h2>Which step needs work?</h2></div><span class="score">${right} / ${done} right</span></div>
  <div class="dots">${SPOT.map((x,i)=>`<button type="button" class="dot ${i in P.spot?(P.spot[i]===x.a?"r":"w"):""} ${i===si?"c":""}" data-act="spot-go" data-v="${i}" aria-label="Question ${i+1}"></button>`).join("")}</div>
  <p class="scen">${q.t}</p>
  <div class="opts">${q.o.map(n=>{const s=STEPS[n-1];let c="";if(ans!=null){if(n===q.a)c="right";else if(n===ans)c="wrong"}
   return `<button type="button" class="opt ${c}" data-act="spot" data-v="${n}"${ans!=null?" disabled":""}>${num(n)}<span><b>Step ${n}</b><br><span class="small">${s.title}</span></span></button>`}).join("")}</div>
  ${ans!=null?`<div class="fb ${ans===q.a?"r":"w"}"><b>${ans===q.a?"Spot on.":"Not quite. It's step "+q.a+"."}</b><p>${q.w}</p><p><b>Teaching idea:</b> ${q.tip}</p>
   <div class="row"><a class="btn ghost sm" href="#step-${q.a}">Open step ${q.a}</a>${si<SPOT.length-1?`<button type="button" class="btn go sm" data-act="spot-go" data-v="${si+1}">Next</button>`:`<button type="button" class="btn go sm" data-act="spot-reset">Start again</button>`}</div></div>`:""}
 </section>
 <section class="card quiz">
  <div class="quiz-h"><div><p class="eyebrow">Myth or fact?</p><h2>Things people say in school</h2></div><span class="score">${mright} / ${mdone} right</span></div>
  <div class="dots">${MYTHS.map((x,i)=>`<button type="button" class="dot ${i in P.myth?((P.myth[i]==="myth")===x.m?"r":"w"):""} ${i===mi?"c":""}" data-act="myth-go" data-v="${i}" aria-label="Card ${i+1}"></button>`).join("")}</div>
  <p class="myth">‘${m.t}’</p>
  ${mans==null?`<div class="row"><button type="button" class="btn go" data-act="myth" data-v="myth">Myth</button><button type="button" class="btn go" data-act="myth" data-v="fact">Fact</button></div>`:
  `<div class="fb ${(mans==="myth")===m.m?"r":"w"}"><b>${(mans==="myth")===m.m?"Right.":"Not this time."} It's a ${m.m?"myth":"fact"}.</b><p>${m.w}</p>
   <div class="row">${mi<MYTHS.length-1?`<button type="button" class="btn go sm" data-act="myth-go" data-v="${mi+1}">Next</button>`:`<button type="button" class="btn go sm" data-act="myth-reset">Start again</button>`}</div></div>`}
 </section></div>`;
}

/* ---------- Router and events ---------- */
function render(){
 const h=(location.hash||"#steps").slice(1);
 let m, html, tab="steps";
 if((m=h.match(/^step-(\d{1,2})$/))&&+m[1]>=1&&+m[1]<=15){html=viewStep(+m[1])}
 else if(h==="check"){html=viewCheck();tab="check"}
 else if(h==="record"){html=viewRecord();tab="record"}
 else if(h==="practise"){html=viewPractise();tab="practise"}
 else html=viewHome();
 app.innerHTML=html;
 document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tab?"page":"false"));
}
const top0=()=>window.scrollTo(0,0);
window.addEventListener("hashchange",()=>{stepTab="look";confirmNew=false;closeTerm();render();top0()});

function openTerm(k){$("#gt").textContent=k;$("#gd").textContent=GLOSS[k];$("#gloss").hidden=false}
function closeTerm(){$("#gloss").hidden=true}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeTerm()});

document.addEventListener("click",e=>{
 const term=e.target.closest(".term");
 if(term){e.preventDefault();openTerm(term.dataset.term);return}
 const el=e.target.closest("[data-act]");
 if(!el)return;
 const a=el.dataset.act, v=el.dataset.v;
 switch(a){
  case "close-term":closeTerm();break;
  case "steptab":stepTab=v;render();break;
  case "start-from":
   if(S){S.cur=+v;S.stage="run";saveS()}else pendingStart=+v;
   location.hash="check";break;
  case "goto":S.cur=+v;S.stage="run";saveS();render();top0();break;
  case "rate":{
   S.res[S.cur]=Object.assign(S.res[S.cur]||{},{s:v});saveS();render();
   const nb=document.getElementById("nextbox");if(nb)nb.scrollIntoView({behavior:reduce()?"auto":"smooth",block:"center"});break}
  case "chip":{
   const r=S.res[S.cur]=S.res[S.cur]||{};r.seen=r.seen||[];const i=+v,at=r.seen.indexOf(i);
   if(at>-1)r.seen.splice(at,1);else r.seen.push(i);saveS();el.setAttribute("aria-pressed",at===-1);break}
  case "results":S.stage="results";saveS();render();top0();break;
  case "back-run":S.stage="run";saveS();if(location.hash!=="#check")location.hash="check";else{render();top0()}break;
  case "copy":{
   const txt=recordText();
   const done=()=>{el.textContent="Copied";setTimeout(()=>{el.textContent="Copy as text"},2000)};
   const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.minHeight="240px";ta.setAttribute("aria-label","Record as text");el.closest(".checkhead").after(ta);ta.select();el.textContent="Select and copy the text below"};
   try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}
   break}
  case "print":window.print();break;
  case "new":confirmNew=true;render();break;
  case "new-no":confirmNew=false;render();break;
  case "new-yes":S=null;store.set("check",null);confirmNew=false;pendingStart=1;location.hash="check";break;
  case "spot":P.spot[P.si]=+v;saveP();render();break;
  case "spot-go":P.si=+v;saveP();render();break;
  case "spot-reset":P.spot={};P.si=0;saveP();render();break;
  case "myth":P.myth[P.mi]=v;saveP();render();break;
  case "myth-go":P.mi=+v;saveP();render();break;
  case "myth-reset":P.myth={};P.mi=0;saveP();render();break;
 }
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.notes){const n=+t.dataset.notes;S.res[n]=S.res[n]||{};S.res[n].notes=t.value;saveS()}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.flag){S.flags=S.flags||{};S.flags[t.dataset.flag]=t.checked;saveS()}
 if("review" in t.dataset){S.review=t.value;saveS()}
});
document.addEventListener("submit",e=>{
 if(e.target.id!=="setup")return;
 e.preventDefault();
 const f=new FormData(e.target), dt=f.get("dt")||today();
 S={pupil:{initials:String(f.get("pi")||"").trim().toUpperCase(),year:f.get("yr"),date:dt,adult:String(f.get("ai")||"").trim().toUpperCase()},
    cur:+f.get("st")||1,res:{},flags:{},stage:"run",review:addDays(dt,42)};
 saveS();render();top0();
});
render();
</script>
